---
name: Import Existing Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (prod/dev)"
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

jobs:
  create-bucket:
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code Source
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Select Project
        run: gcloud config set project ${{ vars.GCP_PROJECT_ID }}

      # Terraform workspaces for dev/prod envinronments
      - name: Select Workspace
        run: terraform workspace select -or-create ${{ github.event.inputs.environment }}

      - name: Init Terraform Directory / Download Providers
        run: |
          terraform \
          -chdir=${{ github.workspace }}/infra/automation/terraform/00_bootstrap \
          init

      - name: Check Format & Validate Terraform files
        working-directory: ${{ github.workspace }}/infra/automation/terraform/00_bootstrap
        run: | 
          terraform fmt -check
          terraform validate

      - name: Import Existing Terraform Backend Bucket
        working-directory: ${{ github.workspace }}/infra/automation/terraform/00_bootstrap
        env:
          BUCKET_ID: ${{ vars.BUCKET_NAME }}
        run: |
          terraform import google_storage_bucket.tf_backend ${BUCKET_ID} \
            -input=false

      - name: Import Existing Infrastructure
        working-directory: ${{ github.workspace }}/infra/automation/terraform/01_infra
        env:
          BUCKET_ID: ${{ vars.BUCKET_NAME }}
        run: |
          terraform import google_storage_bucket.tf_backend ${BUCKET_ID} \
            -input=false
          terraform import google_compute_disk.persistent vm-disk-prod-97532680 \
            -input=false
          terraform import google_compute_network.vpc_network vpc-network-prod-97532680 \
            -input=false
          terraform import google_compute_firewall.https projects/portfolio-prod-97532680/global/firewalls/https-access \
            -input=false
